<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>HERE</title>
    <meta name="description" content="XR Motor Disabilities">

    <link rel="stylesheet" href="src/styles.css">
    <script src="src/ssb/client.ts" type="module"></script>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
    <script src="src/components/phone.ts" type="module"></script>
    <script src="src/components/tremor-sim/hand-override.ts" type="module"></script>
  </head>
  <body>
    <canvas id="streamed-browser-canvas"></canvas>

    <a-scene>
      <a-entity environment="preset: forest; dressingAmount: 500"></a-entity>

      <a-box position="0 0.7 -0.5" scale="0.1 0.1 0.1" color="#4CC3D9" grabbable></a-box>

      <a-entity id="leftHand" hand-tracking-grab-controls="hand: left;"></a-entity>
      <a-entity id="rightHand" hand-tracking-grab-controls="hand: right;"></a-entity>
      
      <a-entity id="browser-device" position="0 1.0 -0.5" grabbable>
        <a-entity id="screen" screen touchable-plane></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
