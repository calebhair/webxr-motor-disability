<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>HERE</title>
    <meta name="description" content="XR Motor Disabilities">

    <link rel="stylesheet" href="src/styles.css">
    
    <script type="module">
      import 'aframe';
      import 'aframe-log-component';
      import 'aframe-environment-component';
    </script>

    <script src="src/ssb/client.ts" type="module"></script>
    <script src="src/components/phone.ts" type="module"></script>
    <script src="src/components/tremor-sim/overrides.ts" type="module"></script>
    <script src="src/components/calibrate-grip.ts" type="module"></script>
    <script src="src/components/hand-touch-pointers.ts" type="module"></script>
    <script src="src/components/ui/main-ui.ts" type="module"></script>
    <script src="src/components/ui/calibration-ui.ts" type="module"></script>
  </head>
  <body>
    <canvas id="streamed-browser-canvas"></canvas>

    <a-scene hand-touch-pointers log="console: false">
      <a-entity environment="preset: contact; dressingAmount: 10"></a-entity>
      <a-log position="0 1 -0.5" scale="0.1 0.1 0.1" grabbable></a-log>

      <a-entity id="leftHand" hand-tracking-grab-controls="hand: left;"></a-entity>
      <a-entity id="rightHand" hand-tracking-grab-controls="hand: right;"></a-entity>

      <a-entity id="calibrate-grip" calibrate-grip></a-entity>
      
      <a-entity id="browser-device" position="0 1.5 -0.5">
        <a-entity id="screen" screen touchable-plane></a-entity>
      </a-entity>

      <a-entity calibration-ui position="0.3 1 -0.4" rotation="0 -45 0"></a-entity>
      <a-entity main-ui position="-0.3 1 -0.4" rotation="0 45 0"></a-entity>
    </a-scene>

  </body>
</html>
