<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>HERE</title>
    <meta name="description" content="XR Motor Disabilities">

    <link rel="stylesheet" href="src/styles.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Quicksand&display=swap');
    </style>
    
    <script type="module">
      import 'aframe';
      import 'aframe-log-component';
      import 'aframe-environment-component';
    </script>

    <script src="src/sbs/client.ts" type="module"></script>
    <script src="src/components/device/screen.ts" type="module"></script>
    <script src="src/components/device/touchable-plane.ts" type="module"></script>
    <script src="src/components/device/device-handler.ts" type="module"></script>
    <script src="src/components/tremor-sim/overrides.ts" type="module"></script>
    <script src="src/components/calibrate-grip.ts" type="module"></script>
    <script src="src/components/xr-entry.ts" type="module"></script>

    <script src="src/components/ui/touch-pointers.ts" type="module"></script>
    <script src="src/components/ui/tremor-ui.ts" type="module"></script>
    <script src="src/components/ui/calibration-hand-ui.ts" type="module"></script>
    <script src="src/components/ui/calibration-ui.ts" type="module"></script>
    <script src="src/components/ui/main-ui.ts" type="module"></script>
  </head>
  <body>
    <a-scene webxr="optionalFeatures: hit-test; referenceSpaceType: local-floor">
      <a-entity id="environment" environment="preset: contact; dressingAmount: 10; active: true;"></a-entity>
      <a-light id="dirlight" intensity="1" light="castShadow:true;type:directional" position="1 1 1"></a-light>
<!--      <a-log position="0 1 -0.5" scale="0.1 0.1 0.1" grabbable></a-log>-->

      <a-entity id="leftHand" hand-tracking-grab-controls="hand: left;"></a-entity>
      <a-entity id="rightHand" hand-tracking-grab-controls="hand: right;"></a-entity>

      <a-entity id="calibrate-grip" calibrate-grip></a-entity>

      <a-entity tremor-ui position="-0.55 1 0" rotation="0 90 0"></a-entity>
      <a-entity calibration-hand-ui></a-entity> <!-- Must come before calibration-ui -->
      <a-entity calibration-ui position="0 1 -0.566" rotation="0 0 0"></a-entity>
      <a-entity main-ui position="-0.4 1 -0.4" rotation="0 45 0"></a-entity>
    </a-scene>

    <!-- Flat UI landing page/config -->
    <div id="ui-overlay">
      <h1 id="title">WebXR Tremor Simulation</h1>

      <form id="config-form">
        <label for="targetUrl">URL</label>
        <input id="targetUrl" name="targetUrl" type="text" value="https://">

        <label for="deviceName">Device</label>
        <select id="deviceName" name="deviceName">
          <option value="iPhone 13">Small phone</option>
          <option value="iPhone 13 landscape">Small phone landscape</option>
          <option value="iPhone 17 Pro Max">Large phone</option>
          <option value="iPhone 17 Pro Max landscape">Large phone landscape</option>
          <option value="Galaxy Z Fold 6">Fold phone</option>
        </select>
      </form>

      <div>
        <button id="enter-vr-btn" >Enter VR</button>
      </div>
    </div>

  </body>
</html>
